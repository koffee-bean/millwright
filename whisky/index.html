<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Griffin's Loot</title>
<meta name="theme-color" content="#1b1714">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap">
<style>
:root{
  --peat:#1b1714;--ivory:#f6f1e7;--panel:#ece4d6;--line:#ddd2bf;
  --ink:#1f1a16;--taupe:#6f655a;--taupe-2:#a39684;--copper:#a8733d;--copper-hi:#c99a62;
  --serif:"Cormorant Garamond",Garamond,"Times New Roman",serif;
  --sans:"Jost","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:130px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--ivory);color:var(--ink);font-family:var(--sans);font-weight:400;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:1.5px solid var(--copper);outline-offset:4px}
.wrap{max-width:1240px;margin:0 auto;padding:0 32px}
.label{font-family:var(--sans);font-size:12px;font-weight:500;letter-spacing:.24em;text-transform:uppercase}

/* hero */
.hero{background:var(--peat);color:var(--ivory);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(70% 90% at 78% 30%,rgba(201,154,98,.20),transparent 60%),radial-gradient(60% 60% at 10% 100%,rgba(168,115,61,.12),transparent 70%);pointer-events:none}
.hero .wrap{position:relative;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:48px;align-items:end;padding-top:88px;padding-bottom:72px}
.hero .label{color:var(--copper-hi)}
.hero h1{font-family:var(--serif);font-weight:400;font-size:clamp(56px,9vw,124px);line-height:.92;letter-spacing:-.015em;margin:22px 0 22px}
.hero .tag{font-family:var(--serif);font-style:italic;font-size:clamp(20px,2vw,26px);color:#d9cdb9;margin:0;max-width:30ch;line-height:1.3}
.tally{list-style:none;margin:48px 0 0;padding:28px 0 0;border-top:1px solid rgba(246,241,231,.16);display:grid;grid-template-columns:repeat(4,minmax(0,auto));justify-content:start}
.tally li{padding:0 32px;border-left:1px solid rgba(246,241,231,.16);display:flex;flex-direction:column;gap:6px}
.tally li:first-child{padding-left:0;border-left:0}
.tally b{font-family:var(--serif);font-weight:400;font-size:40px;line-height:1;color:var(--ivory)}
.tally span{font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--taupe-2)}
.keepers{justify-self:end;text-align:center}
.faces{display:flex;gap:22px;justify-content:center}
.faces button{appearance:none;border:0;background:none;padding:0;cursor:zoom-in;display:flex;flex-direction:column;align-items:center;gap:14px}
.faces img{display:block;width:132px;height:132px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 1px rgba(201,154,98,.7),0 0 0 7px var(--peat),0 0 0 8px rgba(201,154,98,.35);transition:transform .4s ease}
.faces button:hover img{transform:scale(1.04)}
.faces .name{font-size:12px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:#d9cdb9}
.keepers .by{display:block;margin-top:26px;font-family:var(--serif);font-style:italic;font-size:20px;color:var(--taupe-2)}
.keepers .who{display:block;font-family:var(--serif);font-size:30px;color:var(--ivory);line-height:1.1}

/* toolbar */
.bar{position:sticky;top:0;z-index:5;background:rgba(246,241,231,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:14px 40px;flex-wrap:wrap;padding-top:18px;padding-bottom:14px}
.tabs{display:flex;gap:28px}
.tabs button{appearance:none;border:0;background:none;padding:6px 0;cursor:pointer;font-size:12px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:var(--taupe);border-bottom:1.5px solid transparent;transition:color .2s,border-color .2s}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--copper)}
.search{flex:1 1 240px;min-width:0;position:relative;max-width:420px;margin-left:auto}
.search input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:8px 4px 8px 28px;font-family:var(--sans);font-size:15px;color:var(--ink);border-radius:0}
.search input:focus{outline:none;border-bottom-color:var(--copper)}
.search input::placeholder{color:var(--taupe-2)}
.search svg{position:absolute;left:0;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--taupe)}
.jump{display:flex;gap:6px 26px;overflow-x:auto;scrollbar-width:none;width:100%}
.jump::-webkit-scrollbar{display:none}
.jump a{flex:none;font-size:11px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--taupe);text-decoration:none;padding:2px 0}
.jump a:hover{color:var(--copper)}
.jump span{color:var(--taupe-2);margin-left:6px}

/* collection */
.group{padding:88px 0 0}
.group-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding-bottom:22px;border-bottom:1px solid var(--line);margin-bottom:36px}
.group-head .label{color:var(--copper);display:block;margin-bottom:10px}
.group-head h2{font-family:var(--serif);font-weight:400;font-size:clamp(38px,4.6vw,60px);line-height:1;letter-spacing:-.01em;margin:0}
.group-head .sub{font-family:var(--serif);font-style:italic;font-size:22px;color:var(--taupe);white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:48px 28px}
.bottle{appearance:none;border:0;background:none;padding:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;color:inherit}
.shot{background:var(--panel);aspect-ratio:4/5;display:grid;place-items:center;position:relative;overflow:hidden}
.shot img{width:78%;height:88%;object-fit:contain;mix-blend-mode:multiply;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.bottle:hover .shot img{transform:scale(1.05)}
.age{position:absolute;top:14px;left:14px;font-size:10.5px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--ink);background:rgba(246,241,231,.85);padding:5px 9px}
.age.nas{color:var(--taupe)}
.bottle .nm{font-family:var(--serif);font-weight:500;font-size:21px;line-height:1.2;margin-top:18px;transition:color .2s}
.bottle:hover .nm{color:var(--copper)}
.bottle .facts{font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--taupe);margin-top:8px;line-height:1.5}
.empty{text-align:center;font-family:var(--serif);font-style:italic;font-size:26px;color:var(--taupe);padding:120px 0}

/* detail */
dialog{border:0;padding:0;background:var(--ivory);color:var(--ink);width:min(920px,calc(100vw - 24px));max-height:calc(100dvh - 24px);box-shadow:0 40px 80px rgba(27,23,20,.35)}
dialog::backdrop{background:rgba(27,23,20,.62);backdrop-filter:blur(3px)}
.dlg{display:grid;grid-template-columns:1fr}
@media (min-width:700px){.dlg{grid-template-columns:1fr 1fr}}
.dlg .shot{aspect-ratio:auto;min-height:420px}
.dlg .shot img{width:70%;height:80%}
.dlg .body{padding:56px 48px 48px}
@media (max-width:699px){.dlg .shot{min-height:300px}.dlg .body{padding:32px 26px 36px}}
.dlg .label{color:var(--copper)}
.dlg h3{font-family:var(--serif);font-weight:400;font-size:clamp(30px,3.4vw,42px);line-height:1.08;margin:14px 0 28px;padding-right:30px}
.kv{margin:0;border-top:1px solid var(--line)}
.kv div{display:grid;grid-template-columns:110px 1fr;gap:16px;padding:13px 0;border-bottom:1px solid var(--line)}
.kv dt{font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--taupe);padding-top:3px}
.kv dd{margin:0;font-size:16px}
.pet-view{grid-column:1/-1}
.pet-view img{display:block;width:100%}
.pet-view .body{padding:24px 32px 30px;text-align:center}
.pet-view h3{margin:6px 0 0}
.close{position:absolute;top:16px;right:16px;z-index:1;width:40px;height:40px;border:0;border-radius:50%;background:rgba(246,241,231,.92);color:var(--ink);font-size:22px;line-height:1;cursor:pointer}
.foot{background:var(--peat);color:var(--taupe-2);margin-top:120px;padding:48px 0}
.foot .wrap{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
.foot .label{color:var(--copper-hi)}
.foot .when{font-family:var(--serif);font-style:italic;font-size:17px}

@media (max-width:860px){
  .hero .wrap{grid-template-columns:1fr;gap:56px;padding-top:64px;padding-bottom:56px}
  .keepers{justify-self:start;text-align:left}
  .faces{justify-content:flex-start}
  .tally{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:24px}
  .tally li:nth-child(3){padding-left:0;border-left:0}
}
@media (max-width:560px){
  .wrap{padding:0 20px}
  .faces img{width:104px;height:104px}
  .tally li{padding:0 18px}
  .tally b{font-size:34px}
  .search{max-width:none;margin-left:0}
  .group{padding-top:64px}
  .group-head{flex-direction:column;align-items:flex-start;gap:8px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:34px 16px}
  .bottle .nm{font-size:18px;margin-top:12px}
  .bottle .facts{font-size:10.5px;letter-spacing:.1em}
  .age{top:8px;left:8px;font-size:9.5px;padding:4px 7px}
}
@media (prefers-reduced-motion:reduce){.shot img,.faces img,.bottle .nm{transition:none}.bottle:hover .shot img,.faces button:hover img{transform:none}}
</style>
</head>

</dialog>

let mode = get("gl-mode") === "age" ? "age" : "region";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-");
const pad = n => String(n).padStart(2, "0");
const isWhisky = b => b.region !== "Not whisky";
const place = b => b.region === "Other USA" ? b.state : b.region;
const byAge = (a, b) => (b.age || 0) - (a.age || 0) || a.name.localeCompare(b.name);

const card = b => `<button class="bottle" type="button" data-id="${esc(b.id)}">
  <span class="shot"><img loading="lazy" src="img/${esc(b.id)}.webp" width="600" height="900" alt="${esc(b.name)}">
    <span class="age${b.age ? "" : " nas"}">${b.age ? b.age + " years" : "No age stated"}</span></span>
  <span class="nm">${esc(b.name)}</span><span class="facts">${esc([place(b), b.style].filter(Boolean).join(" · "))}</span>
</button>`;

function render() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const rows = DATA.filter(b => !q || [b.name, b.region, b.country, b.style, b.state, b.notes].join(" ").toLowerCase().includes(q));
  let groups;
  if (mode === "region") {
    groups = REGIONS.map(([r, sub]) => ({ title: r, sub, rows: rows.filter(b => b.region === r).sort(byAge) }));
  } else {
    groups = AGES.map(([t, f]) => ({ title: t, sub: "", rows: rows.filter(b => isWhisky(b) && f(b)).sort(byAge) }));
    groups.push({ title: "Also on the shelf", sub: "Not whisky", rows: rows.filter(b => !isWhisky(b)) });
  }
  groups = groups.filter(g => g.rows.length);
  document.getElementById("jump").innerHTML = groups.map(g => `<a href="#g-${slug(g.title)}">${esc(g.title)}<span>${g.rows.length}</span></a>`).join("");
  document.getElementById("list").innerHTML = groups.length ? groups.map(g => `<section class="group" id="g-${slug(g.title)}">
    <div class="group-head"><div><span class="label">${pad(g.rows.length)} ${g.rows.length === 1 ? "bottle" : "bottles"}</span><h2>${esc(g.title)}</h2></div>${g.sub ? `<span class="sub">${esc(g.sub)}</span>` : ""}</div>
    <div class="grid">${g.rows.map(card).join("")}</div></section>`).join("")
    : `<p class="empty">Nothing in the collection matches &ldquo;${esc(q)}&rdquo;.</p>`;
}

function show(b) {
  const where = b.region === "Other USA" ? `${b.state}, USA` : (b.region === b.country || b.region === "Not whisky" ? b.country : `${b.region}, ${b.country}`);
  const age = (b.age ? `${b.age} years` : "No age statement") + (b.age_note ? ` (${b.age_note})` : "");
  const kv = [["Region", where], ["Style", b.style], ["Age", age], ["Strength", b.abv], ["Size", b.size], ["Notes", b.notes]].filter(r => r[1]);
  document.getElementById("dlg-body").innerHTML = `<div class="shot"><img src="img/${esc(b.id)}.webp" alt="${esc(b.name)}"></div>
    <div class="body"><span class="label">${esc(place(b))}</span><h3 id="dlg-title">${esc(b.name)}</h3>
    <dl class="kv">${kv.map(([k, v]) => `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl></div>`;
  document.getElementById("dlg").showModal();
}

document.addEventListener("click", e => {
  const pet = e.target.closest("[data-pet]");
  if (pet) {
    document.getElementById("dlg-body").innerHTML = `<div class="pet-view"><img src="pets/${pet.dataset.pet}.webp" alt="${esc(pet.dataset.name)}"><div class="body"><span class="label" style="color:var(--copper)">Guardian</span><h3 id="dlg-title">${esc(pet.dataset.name)}</h3></div></div>`;
    document.getElementById("dlg").showModal(); return;
  }
  const c = e.target.closest(".bottle"); if (c) { show(DATA.find(b => b.id === c.dataset.id)); return; }
  if (e.target.closest("[data-close]") || e.target.id === "dlg") { document.getElementById("dlg").close(); return; }
  const m = e.target.closest(".tabs button");
  if (m) { mode = m.dataset.mode; put("gl-mode", mode); document.querySelectorAll(".tabs button").forEach(x => x.setAttribute("aria-pressed", x === m)); render(); }
});
document.getElementById("q").addEventListener("input", render);
document.querySelectorAll(".tabs button").forEach(x => x.setAttribute("aria-pressed", x.dataset.mode === mode));
render();
</script>
</body>
</html>
